name: Dependency updates

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Dependency version update scope
        type: choice
        options: [patch, minor, latest]
        default: minor
      packages:
        description: Optional comma separated package names; empty means all
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - uses: checkdigit/github-actions/update-dependencies@dependency-updates-action
        with:
          scope: ${{ inputs.scope }}
          packages: ${{ inputs.packages }}
          validation-scripts: ci:compile,ci:style,ci:lint,ci:test
          # Configure real reviewers here, for example alice,team:maintainers
          reviewers: ''
